<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">

    <h1>🌐 Proxy Generator</h1>

    <div class="grid">

        <input type="text" id="host" placeholder="Host">

        <input type="text" id="port" placeholder="Port">

        <input type="text" id="username" placeholder="Base Username">

        <input type="text" id="password" placeholder="Password">

        <select id="provider">
            <option value="abc">ABCProxy</option>
            <option value="proxy9">9Proxy</option>
        </select>

        <select id="country">
            <option value="US">🇺🇸 United States</option>
            <option value="DE">🇩🇪 Germany</option>
            <option value="PL">🇵🇱 Poland</option>
        </select>

        <input type="number" id="sessionTime" placeholder="Session Time">

        <input type="number" id="count" placeholder="Amount">

    </div>

    <div class="buttons">

        <button onclick="generate()">
            Generate
        </button>

        <button onclick="copyText()">
            Copy
        </button>

    </div>

    <textarea
        id="output"
        placeholder="Generated proxies..."
    ></textarea>

</div>

<script src="script.js"></script>

</body>
</html>
